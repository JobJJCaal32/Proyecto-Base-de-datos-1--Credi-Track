spring.application.name=creditrack
spring.profiles.default=dev
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.datasource.url=jdbc:mysql://${CT_DB_HOST:localhost}:${CT_DB_PORT:3306}/credi_track?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
spring.datasource.username=${CT_DB_USER:ct_backend}
spring.datasource.password=${CT_DB_PASSWORD}
spring.datasource.hikari.pool-name=CrediTrackPool
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080
server.servlet.session.cookie.http-only=true
server.error.include-stacktrace=never

creditrack.zona-horaria=America/Guatemala
creditrack.seguridad.clave-aes=${CT_AES_KEY}
creditrack.seguridad.max-intentos=3
creditrack.sesion.nombre-cookie=CT_SESION
creditrack.sesion.minutos-inactividad=15
creditrack.sesion.cookie-segura=true
creditrack.caja.limite-retiro-sin-autorizacion=10000.00
