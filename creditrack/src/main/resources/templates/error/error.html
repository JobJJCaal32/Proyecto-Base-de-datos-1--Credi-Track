<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Algo salió mal | CrediTrack</title>
    <link rel="stylesheet" th:href="@{/css/creditrack.css}">
</head>
<body>
<main class="centrado">
    <section class="tarjeta">
        <p class="marca">CrediTrack</p>
        <p class="codigo-error" th:text="${status}">error</p>
        <h1>Algo salió mal</h1>
        <p class="subtitulo" th:text="${mensaje} ?: 'Ocurrió un problema al procesar su solicitud. Intente de nuevo.'">Ocurrió un problema al procesar su solicitud. Intente de nuevo.</p>
        <a class="boton" th:href="@{/}">Volver al inicio</a>
    </section>
</main>
</body>
</html>
